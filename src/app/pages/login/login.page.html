<ion-content [fullscreen]="true">

  <div class="auth-page-wrap">

    <!-- BANNER PANORÂMICO NO TOPO COM PROFUNDIDADE -->
    <div class="auth-top-banner">
      <div class="banner-bg" [style.background-image]="'url(assets/auth_banner.jpg)'"></div>
      <div class="banner-gradient"></div>

      <div class="banner-content">
        <img src="assets/organizai-white.png" alt="OrganizAí" class="banner-brand-logo">
        <h1 class="banner-tagline">Suas Finanças em Alto Nível</h1>
        <p class="banner-subline">Gerencie metas, acompanhe rendimentos e tome o controle.</p>
      </div>
    </div>

    <!-- CARD DE LOGIN SOBREPOSTO -->
    <div class="auth-card-container">
      <div class="auth-card-box">

        <div class="form-header">
          <h2>Acesse sua conta</h2>
          <p>Digite seu e-mail e senha para entrar no painel</p>
        </div>

        <form (ngSubmit)="entrar()" class="form-body">

          <!-- E-MAIL -->
          <div class="input-field">
            <label>Endereço de E-mail</label>
            <div class="input-box">
              <ion-icon name="mail-outline" class="field-icon"></ion-icon>
              <input
                type="email"
                [(ngModel)]="email"
                name="email"
                placeholder="seu.email@exemplo.com"
                autocomplete="email"
                required>
            </div>
          </div>

          <!-- SENHA -->
          <div class="input-field">
            <label>Sua Senha</label>
            <div class="input-box">
              <ion-icon name="lock-closed-outline" class="field-icon"></ion-icon>
              <input
                [type]="mostrarSenha ? 'text' : 'password'"
                [(ngModel)]="senha"
                name="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required>
              <button type="button" class="btn-toggle-pass" (click)="toggleMostrarSenha()">
                <ion-icon [name]="mostrarSenha ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </button>
            </div>
          </div>

          <!-- MENSAGEM DE ERRO -->
          <div class="msg-alert msg-erro" *ngIf="erro">
            <ion-icon name="alert-circle-outline"></ion-icon>
            <span>{{ erro }}</span>
          </div>

          <!-- BOTÃO PRINCIPAL -->
          <button
            type="submit"
            class="btn-auth-submit"
            [disabled]="carregando">
            <div class="spinner-auth" *ngIf="carregando"></div>
            <span *ngIf="!carregando">Entrar no OrganizAí</span>
            <ion-icon name="arrow-forward-outline" *ngIf="!carregando"></ion-icon>
          </button>

          <!-- LINK PARA CADASTRO -->
          <div class="switch-auth-link">
            <span>Ainda não possui uma conta?</span>
            <button type="button" (click)="irParaCadastro()">Criar conta gratuita</button>
          </div>

        </form>

      </div>
    </div>

  </div>

</ion-content>
